# AI testers for the INTOP POS desktop app (Compose Desktop jar) on Linux, Windows and macOS.
# The jar is an encrypted release asset (see scripts/fetch_build.sh); results are encrypted
# with results_public.pem like the mobile jobs. Decrypt with: bash scripts/collect.sh <run id>
name: Desktop testers

on:
  workflow_dispatch:
    inputs:
      personas:
        description: Desktop personas from personas.json (comma-separated; dmitri = ru 1366x768, zarina = uz dark, ethan = en)
        default: "dmitri"
      oses:
        description: Which OS to run (comma-separated)
        default: "linux,windows,macos"
      resolutions:
        description: "Screen sizes (comma-separated WxH, e.g. 1280x800,1366x768,1920x1080,2560x1440). Every persona runs at each. Empty = the persona's own size. Linux: any size. Windows: up to 1920x1080 (larger is refused, the closest smaller size is used). macOS: fixed list up to 1920x1080 (1366x768 becomes 1344x756, 2560x1440 becomes 1920x1080); the actual size is written to resolution.txt"
        default: ""
      extra_args:
        description: "Extra app arguments, e.g. a role: --role kiosk (personas with a role add their own --role). Window size flags of the new roles: --window 1080x1920"
        default: ""
      lang:
        description: "Force one app language for every persona: ru, uz or en (empty = each persona's own)"
        default: ""
      brief:
        description: Agent brief file
        default: briefs/intop-pos-desktop.md
      demo:
        description: Start the app with --demo (no server, no credentials)
        type: boolean
        default: true
      model:
        description: "Model: sonnet (default), haiku (cheapest), opus or a full Claude id"
        default: sonnet
      llm_base_url:
        description: "Optional Anthropic-compatible API instead of Claude (key in the LLM_API_KEY secret)"
        default: ""
      build_tag:
        description: Release tag that holds the encrypted jars
        default: builds-20261125

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.m.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        run: test -s results_public.pem || { echo "::error::results_public.pem is missing"; exit 1; }
      - id: m
        env:
          PERSONAS: ${{ inputs.personas }}
          OSES: ${{ inputs.oses }}
          LANG_OVERRIDE: ${{ inputs.lang }}
          RESOLUTIONS: ${{ inputs.resolutions }}
        run: PLATFORM=desktop python3 scripts/matrix.py >> "$GITHUB_OUTPUT"

  desktop:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.desktop) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch and decrypt the build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_DECRYPT_KEY: ${{ secrets.BUILD_DECRYPT_KEY }}
        run: bash scripts/fetch_build.sh "intop-pos-desktop-${{ matrix.os }}.jar" "${{ inputs.build_tag }}"
      - name: Tools (pyautogui, mss, Claude Code)
        run: |
          python -m pip install -q pyautogui mss pillow psutil
          npm install -g --silent @anthropic-ai/claude-code
      - name: Linux desktop packages
        if: matrix.os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb openbox xdotool python3-tk python3-xlib >/dev/null
      - name: Screen size (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $w,$h = '${{ matrix.resolution }}' -split 'x'
          ./scripts/desktop/set_resolution.ps1 -Width $w -Height $h
      - name: Screen size (macOS)
        if: matrix.os == 'macos'
        run: bash scripts/desktop/set_resolution_macos.sh "${{ matrix.resolution }}"
      - name: Agent
        env:
          LABEL: ${{ matrix.label }}
          ROLE: ${{ matrix.role }}
          SECOND_SCREEN: ${{ matrix.second_screen }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OS_NAME: ${{ matrix.os }}
          PERSONA_ID: ${{ matrix.persona }}
          LANG_CODE: ${{ matrix.lang }}
          THEME: ${{ matrix.theme }}
          DEMO: ${{ inputs.demo }}
          BRIEF: ${{ inputs.brief }}
          MODEL: ${{ inputs.model }}
          LLM_BASE_URL: ${{ inputs.llm_base_url }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JAR: intop-pos-desktop-${{ matrix.os }}.jar
          QA_FOOD_OWNER_EMAIL: ${{ secrets.QA_FOOD_OWNER_EMAIL }}
          QA_FOOD_OWNER_PASSWORD: ${{ secrets.QA_FOOD_OWNER_PASSWORD }}
          CLAUDE_CODE_GIT_BASH_PATH: C:\Program Files\Git\bin\bash.exe
          RES: ${{ matrix.resolution }}
        run: |
          if [ "$OS_NAME" = linux ]; then
            SCREENS="-screen 0 ${RES}x24"; [ -n "$SECOND_SCREEN" ] && SCREENS="$SCREENS -screen 1 ${SECOND_SCREEN}x24 +xinerama"
            xvfb-run -a -s "$SCREENS" bash -c 'openbox >/dev/null 2>&1 & sleep 2; bash scripts/desktop/run_agent.sh'
          else
            bash scripts/desktop/run_agent.sh
          fi
      - name: Encrypt results
        if: always()
        run: bash scripts/encrypt_results.sh "desktop-${{ matrix.os }}-${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "results-desktop-${{ matrix.os }}-${{ matrix.label }}", path: results.enc/, retention-days: 14 }
